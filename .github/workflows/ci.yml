name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - name: Lint, formatting and docs build
        if: runner.os == 'Linux'
        run: pnpm lint && pnpm format:check && pnpm docs:build
      - run: pnpm test
      - name: Smoke test the CLI bundle
        run: node packages/cli/dist/vinax.js --version

  binaries:
    name: standalone binary (smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
      - run: pnpm install --frozen-lockfile
      - run: bun scripts/build-binaries.ts linux-x64
      - run: ./dist-bin/vinax-linux-x64 --version && ./dist-bin/vinax-linux-x64 --help
