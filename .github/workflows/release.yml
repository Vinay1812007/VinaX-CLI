name: Release

# Publish only code that passed all CI jobs on main.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  npm:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.version.outputs.release }}
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - id: version
        name: Prepare the next release from the passing commit
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # A newer push must pass its own CI before it can be released.
          git fetch origin main --tags
          if [ "$(git rev-parse origin/main)" != "$EXPECTED_SHA" ]; then
            # Allow retries after this workflow committed only its release metadata.
            if [ "$(git rev-parse origin/main^)" = "$EXPECTED_SHA" ] &&
               [ "$(git log -1 --format=%s origin/main)" = "chore: release vinax" ] &&
               [ -z "$(git diff --name-only "$EXPECTED_SHA" origin/main -- . ':!packages/cli/package.json' ':!packages/cli/CHANGELOG.md')" ]; then
              git switch --detach origin/main
            else
              echo "release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          node scripts/prepare-release.mjs
          if ! git diff --quiet -- packages/cli/package.json packages/cli/CHANGELOG.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add packages/cli/package.json packages/cli/CHANGELOG.md
            git commit -m "chore: release vinax"
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
        if: steps.version.outputs.release == 'true'
      - name: Build and publish npm package
        if: steps.version.outputs.release == 'true'
        run: pnpm release
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'

  binaries:
    needs: npm
    if: needs.npm.outputs.release == 'true'
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            targets: linux-x64 linux-arm64 linux-x64-musl linux-arm64-musl windows-x64 windows-arm64
            smoke-target: linux-x64
          # macOS builds are made (and ad-hoc signed) on macOS so Gatekeeper accepts them.
          - os: macos-latest
            targets: darwin-x64 darwin-arm64
            smoke-target: darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.npm.outputs.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
      - run: pnpm install --frozen-lockfile
      - run: bun scripts/build-binaries.ts ${{ matrix.targets }}
        env:
          VINAX_RELEASE_VERSION: ${{ needs.npm.outputs.version }}
      - name: Sign (macOS)
        if: runner.os == 'macOS'
        run: for f in dist-bin/vinax-darwin-*; do codesign --force --sign - "$f"; done
      - name: Verify binary version before upload
        env:
          EXPECTED_VERSION: ${{ needs.npm.outputs.version }}
          SMOKE_TARGET: ${{ matrix.smoke-target }}
        run: |
          actual="$(./dist-bin/vinax-$SMOKE_TARGET --version)"
          if [ "$actual" != "$EXPECTED_VERSION" ]; then
            echo "Expected $EXPECTED_VERSION, but binary reports $actual" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.os }}
          path: dist-bin/vinax-*

  github-release:
    needs: [npm, binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.npm.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          path: dist-bin
          pattern: binaries-*
          merge-multiple: true
      - name: Checksums
        run: cd dist-bin && sha256sum vinax-* > SHA256SUMS && cat SHA256SUMS
      - name: Release notes
        run: |
          node -e "
            const v = process.argv[1];
            const log = require('fs').readFileSync('packages/cli/CHANGELOG.md', 'utf8');
            const m = log.split(/^## /m).find((s) => s.startsWith(v + '\n'));
            process.stdout.write((m ? m.slice(v.length + 1) : 'See CHANGELOG.md') + '\n\nInstall: https://github.com/${{ github.repository }}#install\n');
          " "${{ needs.npm.outputs.version }}" > notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ needs.npm.outputs.version }}" dist-bin/* \
            --title "VinaX v${{ needs.npm.outputs.version }}" --notes-file notes.md --target "${{ needs.npm.outputs.sha }}"
